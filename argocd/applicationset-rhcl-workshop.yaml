apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rhcl-workshop
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      # 環境ごとのパラメータ
      - env: sandbox589
        clusterId: cftzv
        externalBaseDomain: sandbox589.opentlc.com

      # 新環境を追加する場合はここに追記
      # - env: sandbox700
      #   clusterId: zzzzz
      #   externalBaseDomain: sandbox700.opentlc.com

  template:
    metadata:
      name: rhcl-workshop-{{env}}
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kamorisan/demo-rhcl.git
        targetRevision: main  # プレースホルダーのまま
        path: gitops/apps/rhcl-demo/overlays/rhcl2
        kustomize:
          patches:
          # ==========================================
          # Certificate
          # ==========================================
          - target:
              group: cert-manager.io
              version: v1
              kind: Certificate
              name: rhcl-gw-public-tls
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/dnsNames
                value:
                  - rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - mcp.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - external.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - external-api.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # Gateway rhcl-gw (6 listeners)
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: Gateway
              name: rhcl-gw
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/listeners/0/hostname
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/1/hostname
                value: oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/2/hostname
                value: oidc-rhcl-workshop.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/3/hostname
                value: external-api.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/4/hostname
                value: mcp.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/5/hostname
                value: mcp.{{externalBaseDomain}}

          # ==========================================
          # Gateway rhcl-ai-gw (2 listeners)
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: Gateway
              name: rhcl-ai-gw
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/listeners/0/hostname
                value: ai.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/1/hostname
                value: ai.{{externalBaseDomain}}

          # ==========================================
          # Gateway rhcl-mcp-gw (2 listeners)
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: Gateway
              name: rhcl-mcp-gw
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/listeners/0/hostname
                value: mcp.{{externalBaseDomain}}
              - op: replace
                path: /spec/listeners/1/hostname
                value: mcp.{{externalBaseDomain}}

          # ==========================================
          # Routes
          # ==========================================
          - target:
              group: route.openshift.io
              version: v1
              kind: Route
              name: rhcl-gw
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/host
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          - target:
              group: route.openshift.io
              version: v1
              kind: Route
              name: rhcl-gw-oidc
              namespace: openshift-ingress
            patch: |-
              - op: replace
                path: /spec/host
                value: oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - demo namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: rhcl-ui
              namespace: demo
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: demo-api
              namespace: demo
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: external-proxy-public
              namespace: demo
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: external-api.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - demo-ab namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: ab-demo
              namespace: demo-ab
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - demo-jwt namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: jwt-demo
              namespace: demo-jwt
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - rhcl-ai-bot namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: ai-bot-main
              namespace: rhcl-ai-bot
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: ai-bot-ai
              namespace: rhcl-ai-bot
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: ai.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - rhcl-oidc-portal namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: secure-demo
              namespace: rhcl-oidc-portal
            patch: |-
              - op: replace
                path: /spec/hostnames
                value:
                  - oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - oidc-rhcl-workshop.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: oidc-portal
              namespace: rhcl-oidc-portal
            patch: |-
              - op: replace
                path: /spec/hostnames
                value:
                  - oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - oidc-rhcl-workshop.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: oidc-callback
              namespace: rhcl-oidc-portal
            patch: |-
              - op: replace
                path: /spec/hostnames
                value:
                  - oidc-rhcl-workshop.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - oidc-rhcl-workshop.{{externalBaseDomain}}

          # ==========================================
          # HTTPRoutes - mcp-system namespace
          # ==========================================
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: rhcl-mcp-gateway
              namespace: mcp-system
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: mcp.{{externalBaseDomain}}

          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: rhcl-mcp-tools
              namespace: mcp-system
            patch: |-
              - op: replace
                path: /spec/hostnames/0
                value: mcp.{{externalBaseDomain}}

          # ==========================================
          # OIDCPolicy
          # ==========================================
          - target:
              group: extensions.kuadrant.io
              version: v1alpha1
              kind: OIDCPolicy
              name: secure-demo-oidc
              namespace: rhcl-oidc-portal
            patch: |-
              - op: replace
                path: /spec/provider/issuerURL
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/auth/realms/rhcl
              - op: replace
                path: /spec/provider/authorizationEndpoint
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/auth/realms/rhcl/protocol/openid-connect/auth
              - op: replace
                path: /spec/provider/tokenEndpoint
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/auth/realms/rhcl/protocol/openid-connect/token
              - op: replace
                path: /spec/provider/redirectURI
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/oidc/callback

          # ==========================================
          # AuthPolicy
          # ==========================================
          - target:
              group: kuadrant.io
              version: v1
              kind: AuthPolicy
              name: secure-demo-jwt
              namespace: rhcl-oidc-portal
            patch: |-
              - op: replace
                path: /spec/defaults/rules/authentication/jwt/jwt/issuerUrl
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/auth/realms/rhcl

          - target:
              group: kuadrant.io
              version: v1
              kind: AuthPolicy
              name: jwt-demo-jwt
              namespace: demo-jwt
            patch: |-
              - op: replace
                path: /spec/defaults/rules/authentication/jwt/jwt/issuerUrl
                value: https://oidc-rhcl-workshop.{{externalBaseDomain}}/auth/realms/rhcl

          # ==========================================
          # Deployment - rhcl-ai-bot
          # ==========================================
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: rhcl-ai-bot
              namespace: rhcl-ai-bot
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: RHCL_AI_ESPN_BASE_URL
                    value: https://external-api.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - name: RHCL_AI_MCP_BASE_URL
                    value: https://mcp.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}
                  - name: RHCL_AI_MCP_PATH
                    value: /mcp

          # ==========================================
          # Deployment - rhcl-mcp-tools
          # ==========================================
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: rhcl-mcp-tools
              namespace: mcp-system
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env
                value:
                  - name: RHCL_AI_ESPN_BASE_URL
                    value: https://external-api.{{externalBaseDomain}}

          # ==========================================
          # MCPGatewayExtension
          # ==========================================
          - target:
              group: mcp.kuadrant.io
              version: v1alpha1
              kind: MCPGatewayExtension
              name: rhcl-mcp
              namespace: mcp-system
            patch: |-
              - op: replace
                path: /spec/publicHost
                value: mcp.{{externalBaseDomain}}

          # ==========================================
          # Secret - mcp-gateway-config
          # ==========================================
          - target:
              version: v1
              kind: Secret
              name: mcp-gateway-config
              namespace: mcp-system
            patch: |-
              - op: replace
                path: /stringData/config.yaml
                value: |
                  servers:
                    - enabled: true
                      hostname: mcp.{{externalBaseDomain}}
                      name: mcp-system/rhcl-mcp-tools
                      toolPrefix: tools_
                      url: http://rhcl-mcp-tools-bridge.mcp-system.svc.cluster.local:8080

          # ==========================================
          # Grafana
          # ==========================================
          - target:
              group: grafana.integreatly.org
              version: v1beta1
              kind: Grafana
              name: rhcl-grafana
              namespace: monitoring
            patch: |-
              - op: replace
                path: /spec/route/spec/host
                value: grafana.apps.cluster-{{clusterId}}.{{clusterId}}.{{externalBaseDomain}}

          # ==========================================
          # ConfigMap - rhcl-ui (UI index.html)
          # ==========================================
          # Note: UIのConfigMapは生成されたもので、名前がハッシュ付きなので
          # 直接patchできません。代わりにbase/ui/index.htmlを編集する必要があります。
          # 今回はindex.htmlをプレースホルダーのままにしているので、
          # UIの動的生成ロジックが正しいホスト名を使用することを期待します。

      destination:
        server: https://kubernetes.default.svc
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
