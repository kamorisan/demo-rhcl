apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-callback
  namespace: rhcl-oidc-portal
  labels:
    app: oidc-callback
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-callback
  template:
    metadata:
      labels:
        app: oidc-callback
    spec:
      containers:
        - name: node
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8080"
            - name: OIDC_CLIENT_ID
              value: "rhcl-ui"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: oidc-callback
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-callback
  namespace: rhcl-oidc-portal
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  selector:
    app: oidc-callback
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080

