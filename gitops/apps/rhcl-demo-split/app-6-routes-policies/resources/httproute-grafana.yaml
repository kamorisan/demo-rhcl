apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-rhcl-workshop
  namespace: monitoring
  labels:
    app: rhcl-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  hostnames:
    - grafana-rhcl-workshop.REPLACE_ME_EXTERNAL_BASE_DOMAIN
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: rhcl-workshop-gw
      namespace: openshift-ingress
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: rhcl-grafana-service
          port: 3000
          weight: 1
