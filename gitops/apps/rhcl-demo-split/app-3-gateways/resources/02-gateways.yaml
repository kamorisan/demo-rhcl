apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rhcl-gw
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-main-public
      port: 443
      protocol: HTTPS
      hostname: rhcl-workshop.REPLACE_ME_APPS_CLUSTER_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cert-manager-ingress-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: https-oidc-public
      port: 443
      protocol: HTTPS
      hostname: oidc-rhcl-workshop.REPLACE_ME_APPS_CLUSTER_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cert-manager-ingress-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: https-oidc-sandbox
      port: 443
      protocol: HTTPS
      hostname: oidc-rhcl-workshop.REPLACE_ME_EXTERNAL_BASE_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: rhcl-gw-oidc-sandbox-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-external-public
      port: 443
      protocol: HTTPS
      hostname: external-api.REPLACE_ME_EXTERNAL_BASE_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: rhcl-gw-external-sandbox-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-mcp-public
      port: 443
      protocol: HTTPS
      hostname: mcp.REPLACE_ME_APPS_CLUSTER_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cert-manager-ingress-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: https-mcp-sandbox
      port: 443
      protocol: HTTPS
      hostname: mcp.REPLACE_ME_EXTERNAL_BASE_DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: rhcl-gw-mcp-sandbox-tls
      allowedRoutes:
        namespaces:
          from: All
---
