---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test-server1
  namespace: mcp-system
  labels:
    app: mcp-test-server1
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-test-server1
  template:
    metadata:
      labels:
        app: mcp-test-server1
    spec:
      containers:
      - name: mcp-test-server1
        image: ghcr.io/kuadrant/mcp-gateway/test-server1:latest
        imagePullPolicy: Always
        command: ["/mcp-test-server"]
        args: ["--http", "0.0.0.0:9090"]
        ports:
        - containerPort: 9090
          name: http
        env:
        - name: LOG_LEVEL
          value: "info"
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-test-server1
  namespace: mcp-system
  labels:
    app: mcp-test-server1
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 9090
    name: http
  selector:
    app: mcp-test-server1
