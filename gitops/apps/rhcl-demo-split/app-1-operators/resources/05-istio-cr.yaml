# Istio control plane (creates istio GatewayClass)
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: v1.28-latest
  namespace: istio-system
  updateStrategy:
    type: InPlace
  values:
    meshConfig:
      enableTracing: true
      defaultConfig:
        tracing:
          sampling: 100.0
          zipkin:
            address: rhcl-otel-collector-collector.opentelemetry.svc.cluster.local:9411
      extensionProviders:
        - name: otel-tracing
          zipkin:
            service: rhcl-otel-collector-collector.opentelemetry.svc.cluster.local
            port: 9411
