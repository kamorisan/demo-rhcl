apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhcl-app-4-demo-apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kamorisan/demo-rhcl.git
    targetRevision: feature/apps345-espn-tools-verified
    path: gitops/apps/rhcl-demo-split/app-4-demo-apps
    kustomize:
      patches:
        - target:
            group: apps
            version: v1
            kind: Deployment
            name: rhcl-ai-bot
            namespace: rhcl-ai-bot
          patch: |-
            - op: replace
              path: /spec/template/spec/containers/0/env/8/value
              value: https://external-api.sandbox2689.opentlc.com
            - op: replace
              path: /spec/template/spec/containers/0/env/9/value
              value: http://rhcl-mcp-gw-istio.openshift-ingress.svc.cluster.local
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rhcl-ai-bot
      namespace: rhcl-ai-bot
      jqPathExpressions:
        - .spec.template.spec.containers[].image
