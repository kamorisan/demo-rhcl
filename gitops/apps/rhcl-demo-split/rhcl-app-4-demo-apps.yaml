apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhcl-app-4-demo-apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kamorisan/demo-rhcl.git
    targetRevision: feature/split-applications
    path: gitops/apps/rhcl-demo-split/app-4-demo-apps
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rhcl-ai-bot
      namespace: rhcl-ai-bot
      jqPathExpressions:
        - .spec.template.spec.containers[].image
