apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Phase 1: Core HTTPRoutes and AuthPolicies
  - resources/httproute-ui.yaml
  - resources/httproute-oidc-portal.yaml
  - resources/httproute-api.yaml
  - resources/ui-authpolicy.yaml
  - resources/oidc-portal-authpolicy.yaml

  # ReferenceGrant for secure-demo HTTPRoute (oidc-portal → demo/external-proxy)
  - resources/referencegrant-oidc-to-external-proxy.yaml

  # Phase 2: Keycloak
  - resources/httproute-keycloak.yaml
  - resources/keycloak-authpolicy.yaml
  - resources/httproute-oidc-portal-callback.yaml
  - resources/oidc-portal-callback-authpolicy.yaml
  - resources/httproute-oidc-portal-whoami.yaml
  - resources/oidc-portal-whoami-authpolicy.yaml

  # Phase 3: AI Bot and MCP Gateway
  - resources/httproute-ai-bot-main.yaml
  - resources/httproute-ai-bot-ai.yaml
  - resources/ai-bot-main-authpolicy.yaml
  - resources/ai-bot-main-tokenratelimitpolicy.yaml
  - resources/ai-bot-ai-tokenratelimitpolicy.yaml
  - resources/mcp-gateway-extension.yaml
  - resources/httproute-mcp-gateway.yaml
  - resources/mcp-authpolicy.yaml
  - resources/mcp-gateway-referencegrant.yaml
  - resources/referencegrant-mcp-to-ai-bot-service.yaml
  - resources/ai-bot-mcp-httproute.yaml
  - resources/ai-bot-mcp-authpolicy.yaml
  - resources/ai-bot-mcpserverregistration.yaml

  # Phase 4: External Proxy
  - resources/httproute-external-proxy.yaml
  - resources/httproute-external-proxy-public.yaml
  - resources/external-proxy-authpolicy.yaml

  # Phase 5: A/B Canary and JWT Demo
  - resources/httproute-ab-canary-external.yaml
  - resources/httproute-jwt-demo.yaml
  - resources/ab-authpolicy.yaml
  - resources/jwt-demo-authpolicy.yaml
  - resources/secure-jwt-authpolicy.yaml
  - resources/secure-oidcpolicy.yaml

  # Phase 6: HTTP-to-HTTPS redirect, Gateway/Route policies, ReferenceGrants
  - resources/httproute-http-to-https.yaml
  - resources/gateway-authpolicy.yaml
  - resources/route-authpolicy.yaml
  - resources/route-ratelimitpolicy.yaml
  - resources/api-keys.yaml
  - resources/referencegrant-jwt-to-external-proxy.yaml

# All 29 resources now included
# Hostname and Gateway name replacements handled via ArgoCD Application patches
