apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-bot-mcp-server
  namespace: rhcl-ai-bot
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  parentRefs:
    - name: rhcl-mcp-gw
      namespace: openshift-ingress
  hostnames:
    - mcp.REPLACE_ME_EXTERNAL_BASE_DOMAIN
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rhcl-ai-bot
          port: 80
          weight: 1
