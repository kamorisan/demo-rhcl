apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-bot-mcp-server
  namespace: mcp-system
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  parentRefs:
    - name: rhcl-mcp-gw
      namespace: openshift-ingress
      sectionName: mcps
  hostnames:
    - ai-bot.mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rhcl-ai-bot
          namespace: rhcl-ai-bot
          port: 80
          weight: 1
