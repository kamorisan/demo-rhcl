apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oidc-portal-callback
  namespace: rhcl-oidc-portal
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  hostnames:
    - oidc-rhcl-workshop.example.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: rhcl-gw
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: Exact
            value: /oidc/callback
      backendRefs:
        - group: ""
          kind: Service
          name: oidc-callback
          namespace: rhcl-oidc-portal
          port: 80
          weight: 1
