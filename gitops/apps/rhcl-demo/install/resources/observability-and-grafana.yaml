apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# OpenShift Service Mesh 3 Operator (provides Istio via Sail Operator)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
# Istio namespace for control plane
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Istio control plane (creates istio GatewayClass)
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: v1.28-latest
  namespace: istio-system
---
# Grant Argo CD application controller necessary permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhcl-argocd-application-controller-admin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhcl-observability-bootstrap
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhcl-observability-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
subjects:
  - kind: ServiceAccount
    name: rhcl-observability-bootstrap
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-user-workload-monitoring
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: rhcl-observability-bootstrap
      restartPolicy: Never
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              oc -n openshift-monitoring create configmap cluster-monitoring-config \
                --from-literal=config.yaml=$'enableUserWorkload: true\n' \
                --dry-run=client -o yaml | oc apply -f -
              echo "OK: user workload monitoring enabled"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-kuadrant-observability-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: rhcl-observability-bootstrap
      restartPolicy: Never
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              # Ensure required namespaces exist
              for ns in gateway-system kuadrant-system monitoring; do
                oc create namespace "$ns" --dry-run=client -o yaml | oc apply -f -
              done
              # Apply observability config (includes Grafana Operator)
              oc apply -k "https://github.com/Kuadrant/kuadrant-operator/config/install/configure/observability?ref=v1.2.0" || true
              # Wait for Grafana Operator subscription to be created
              sleep 5
              # Ensure automatic approval
              oc -n openshift-operators patch subscription grafana-operator --type=merge -p '{"spec":{"installPlanApproval":"Automatic"}}' 2>/dev/null || true
              # Wait for Grafana CRDs to be installed
              echo "Waiting for Grafana CRDs..."
              for i in {1..60}; do
                if oc get crd grafanas.grafana.integreatly.org >/dev/null 2>&1; then
                  echo "Grafana CRDs are ready"
                  exit 0
                fi
                echo "Waiting... ($i/60)"
                sleep 5
              done
              echo "Warning: Grafana CRDs may not be fully ready, but proceeding..."
              exit 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-kuadrant-example-dashboards
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: rhcl-observability-bootstrap
      restartPolicy: Never
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              oc -n monitoring apply -k "https://github.com/Kuadrant/kuadrant-operator/examples/dashboards?ref=v1.3.0"
              echo "OK: dashboard configmaps applied"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhcl-grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhcl-grafana-cluster-monitoring-view
  annotations:
    argocd.argoproj.io/sync-wave: "5"
subjects:
  - kind: ServiceAccount
    name: rhcl-grafana
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhcl-grafana-thanos-token
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: rhcl-observability-bootstrap
      restartPolicy: Never
      containers:
        - name: oc
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              TOKEN="$(oc -n monitoring create token rhcl-grafana --duration=168h)"
              URL="$(oc -n openshift-monitoring get route thanos-querier -o jsonpath='https://{.status.ingress[].host}' 2>/dev/null || true)"
              if [ -z "${URL:-}" ]; then
                URL="https://thanos-querier.openshift-monitoring.svc:9091"
              fi
              oc -n monitoring create secret generic rhcl-grafana-thanos \
                --from-literal=PROMETHEUS_TOKEN="$TOKEN" \
                --from-literal=THANOS_URL="$URL" \
                --dry-run=client -o yaml | oc apply -f -
              echo "OK: grafana datasource secret updated"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: rhcl-grafana
  namespace: monitoring
  labels:
    app: rhcl-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    auth:
      disable_login_form: "true"
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
    log:
      mode: console
  route:
    spec:
      host: REPLACE_ME_GRAFANA_HOSTNAME
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: rhcl-thanos
  namespace: monitoring
  labels:
    app: rhcl-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  instanceSelector:
    matchLabels:
      app: rhcl-grafana
  valuesFrom:
    - targetPath: "url"
      valueFrom:
        secretKeyRef:
          name: rhcl-grafana-thanos
          key: THANOS_URL
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: rhcl-grafana-thanos
          key: PROMETHEUS_TOKEN
  datasource:
    name: rhcl-thanos
    type: prometheus
    access: proxy
    isDefault: true
    url: "${THANOS_URL}"
    jsonData:
      tlsSkipVerify: true
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Bearer ${PROMETHEUS_TOKEN}"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rhcl-app-developer
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  instanceSelector:
    matchLabels:
      app: rhcl-grafana
  resyncPeriod: 30s
  uid: rhcl-app-dev
  folder: RHCL Workshop
  configMapRef:
    name: grafana-app-developer
