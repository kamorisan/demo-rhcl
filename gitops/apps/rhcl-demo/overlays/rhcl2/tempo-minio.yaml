apiVersion: v1
kind: Namespace
metadata:
  name: rhcl-observability
  annotations:
    argocd.argoproj.io/sync-wave: "23"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-minio
  namespace: rhcl-observability
  labels:
    app: tempo-minio
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo-minio
  template:
    metadata:
      labels:
        app: tempo-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: tempo
            - name: MINIO_ROOT_PASSWORD
              value: tempo-tempo-tempo
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-minio
  namespace: rhcl-observability
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  selector:
    app: tempo-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tempo-minio-create-bucket
  namespace: rhcl-observability
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: quay.io/minio/mc:latest
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO to be ready..."
              for i in $(seq 1 30); do
                if mc alias set myminio http://tempo-minio.rhcl-observability.svc.cluster.local:9000 tempo tempo-tempo-tempo 2>/dev/null; then
                  echo "MinIO is ready"
                  break
                fi
                echo "Waiting... ($i/30)"
                sleep 2
              done

              if mc ls myminio/tempo-traces > /dev/null 2>&1; then
                echo "Bucket tempo-traces already exists"
              else
                echo "Creating bucket tempo-traces..."
                mc mb myminio/tempo-traces
                echo "Bucket created successfully"
              fi
