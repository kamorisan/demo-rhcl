<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHCL Chatbot - MCP Gateway Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: #667eea;
      color: white;
    }

    .message.bot .message-avatar {
      background: #764ba2;
      color: white;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;  /* Preserve newlines from response */
    }

    .message.user .message-content {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot .message-content {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .message-tool {
      font-size: 12px;
      color: #667eea;
      margin-top: 8px;
      padding: 6px 10px;
      background: #f0f2ff;
      border-radius: 6px;
      display: block;
    }

    .message-error {
      font-size: 12px;
      color: #dc3545;
      margin-top: 8px;
      padding: 6px 10px;
      background: #ffe0e0;
      border-radius: 6px;
      display: inline-block;
    }

    .typing-indicator {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .typing-indicator.active {
      display: flex;
    }

    .typing-indicator .message-avatar {
      background: #764ba2;
      color: white;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }

    .input-form {
      display: flex;
      gap: 12px;
    }

    .input-field {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      border-color: #667eea;
    }

    .send-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .welcome-message {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .welcome-message h2 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #667eea;
    }

    .welcome-message p {
      font-size: 14px;
      line-height: 1.6;
    }

    .example-queries {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .example-query {
      padding: 8px 14px;
      background: #f0f2ff;
      color: #667eea;
      border: 1px solid #667eea;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .example-query:hover {
      background: #667eea;
      color: white;
    }

    /* Scrollbar styling */
    .chat-box::-webkit-scrollbar {
      width: 8px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    .chat-box::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 RHCL Chatbot</h1>
      <p>MCP Gateway Demo - Sports Information Assistant</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="welcome-message">
        <h2>Welcome! 👋</h2>
        <p>Ask me about sports games and I'll fetch the information for you using MCP Gateway.</p>
        <p>I support <strong>NBA, Premier League, La Liga, NFL, and NHL</strong>.</p>
        <div class="example-queries">
          <span class="example-query" onclick="sendExample('What NBA games are happening today?')">NBA games today</span>
          <span class="example-query" onclick="sendExample('Premier Leagueの最近の試合は？')">Premier League</span>
          <span class="example-query" onclick="sendExample('Show me recent La Liga matches')">La Liga matches</span>
        </div>
      </div>

      <div class="typing-indicator" id="typingIndicator">
        <div class="message-avatar">🤖</div>
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <form class="input-form" id="chatForm">
        <input
          type="text"
          class="input-field"
          id="messageInput"
          placeholder="Type your message..."
          autocomplete="off"
          required
        />
        <button type="submit" class="send-button" id="sendButton">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');

    // Remove welcome message when first message is sent
    let isFirstMessage = true;

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;

      // Remove welcome message
      if (isFirstMessage) {
        const welcomeMsg = document.querySelector('.welcome-message');
        if (welcomeMsg) welcomeMsg.remove();
        isFirstMessage = false;
      }

      // Add user message to chat
      addMessage('user', message);
      messageInput.value = '';

      // Show typing indicator
      typingIndicator.classList.add('active');
      scrollToBottom();

      // Disable send button
      sendButton.disabled = true;

      try {
        // Send message to backend
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();

        // Hide typing indicator
        typingIndicator.classList.remove('active');

        // Add bot response to chat
        addMessage('bot', data.response, data.tool_used, data.error);

      } catch (error) {
        typingIndicator.classList.remove('active');
        addMessage('bot', 'Sorry, something went wrong. Please try again.', null, error.message);
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    });

    function addMessage(type, text, toolUsed = null, error = null) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = type === 'user' ? '👤' : '🤖';

      const content = document.createElement('div');
      content.className = 'message-content';
      content.textContent = text;

      // Add tool information if provided
      if (toolUsed) {
        const toolInfo = document.createElement('div');
        toolInfo.className = 'message-tool';
        toolInfo.textContent = `🔧 Tool used: ${toolUsed}`;
        content.appendChild(toolInfo);
      }

      // Add error information if provided
      if (error) {
        const errorInfo = document.createElement('div');
        errorInfo.className = 'message-error';
        errorInfo.textContent = `⚠️ Error: ${error}`;
        content.appendChild(errorInfo);
      }

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(content);

      // Insert before typing indicator
      chatBox.insertBefore(messageDiv, typingIndicator);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendExample(message) {
      messageInput.value = message;
      chatForm.dispatchEvent(new Event('submit'));
    }

    // Focus input on load
    messageInput.focus();
  </script>
</body>
</html>
