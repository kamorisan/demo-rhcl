# Quarkus Application Configuration
quarkus.application.name=rhcl-chatbot
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS Configuration (allow WebUI access from different origins)
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,origin,x-requested-with
quarkus.http.cors.exposed-headers=*

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.redhat.rhcl.chatbot".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# MCP Gateway Configuration
# Base URL for MCP Gateway (external)
rhcl.mcp.base-url=${RHCL_MCP_BASE_URL:http://mcp.sandbox356.opentlc.com/mcp}
# MCP request timeout in seconds
rhcl.mcp.timeout-seconds=${RHCL_MCP_TIMEOUT_SECONDS:30}

# OpenAI Compatible LLM API Configuration
# Base URL for OpenAI-compatible API
rhcl.openai.base-url=${RHCL_OPENAI_BASE_URL:https://litellm-prod.apps.maas.redhatworkshops.io/v1}
# LLM model name
rhcl.openai.model=${RHCL_OPENAI_MODEL:deepseek-r1-distill-qwen-14b}
# API key (should be set via environment variable or Secret in OpenShift)
rhcl.openai.api-key=${RHCL_OPENAI_API_KEY:}
# LLM request timeout in seconds
rhcl.openai.timeout-seconds=${RHCL_OPENAI_TIMEOUT_SECONDS:45}

# Chatbot Configuration
# Default date range for sports queries (in days, ±N days from today)
rhcl.chatbot.default-dates-range=${RHCL_CHATBOT_DEFAULT_DATES_RANGE:7}

# Health checks
quarkus.smallrye-health.root-path=/q/health

# Container Image Configuration (for Podman/Docker build)
quarkus.container-image.builder=jib
quarkus.container-image.group=
quarkus.container-image.name=rhcl-chatbot
quarkus.container-image.tag=1.0.0-SNAPSHOT
quarkus.container-image.registry=
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime:1.20

# Production profile overrides
%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."com.redhat.rhcl.chatbot".level=INFO
