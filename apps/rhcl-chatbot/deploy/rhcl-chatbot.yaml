---
apiVersion: v1
kind: Secret
metadata:
  name: rhcl-chatbot-secret
  namespace: rhcl-ai-bot
type: Opaque
stringData:
  openai-api-key: "REPLACE_ME_WITH_ACTUAL_API_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhcl-chatbot
  namespace: rhcl-ai-bot
  labels:
    app: rhcl-chatbot
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhcl-chatbot
  template:
    metadata:
      labels:
        app: rhcl-chatbot
        version: v1
    spec:
      containers:
        - name: rhcl-chatbot
          image: rhcl-chatbot:1.0.0-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # MCP Gateway Configuration
            - name: RHCL_MCP_BASE_URL
              value: "http://mcp.sandbox356.opentlc.com/mcp"
            - name: RHCL_MCP_TIMEOUT_SECONDS
              value: "10"

            # OpenAI Compatible LLM API Configuration
            - name: RHCL_OPENAI_BASE_URL
              value: "https://litellm-prod.apps.maas.redhatworkshops.io/v1"
            - name: RHCL_OPENAI_MODEL
              value: "deepseek-r1-distill-qwen-14b"
            - name: RHCL_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rhcl-chatbot-secret
                  key: openai-api-key
            - name: RHCL_OPENAI_TIMEOUT_SECONDS
              value: "15"

            # Chatbot Configuration
            - name: RHCL_CHATBOT_DEFAULT_DATES_RANGE
              value: "7"

            # CORS Configuration
            - name: QUARKUS_HTTP_CORS
              value: "true"
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "/.*/"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rhcl-chatbot
  namespace: rhcl-ai-bot
  labels:
    app: rhcl-chatbot
spec:
  selector:
    app: rhcl-chatbot
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhcl-chatbot
  namespace: rhcl-ai-bot
  labels:
    app: rhcl-chatbot
spec:
  to:
    kind: Service
    name: rhcl-chatbot
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
