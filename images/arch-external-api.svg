<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1026px" preserveAspectRatio="none" style="width:1071px;height:1026px;background:#FFFFFF;" version="1.1" viewBox="0 0 1071 1026" width="1071px" zoomAndPan="magnify"><title>External API Architecture
(ESPN Proxy via Gateway)</title><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="180.2979" x="438.4342" y="23.5352">External API Architecture</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182.4033" x="437.3815" y="40.0234">(ESPN Proxy via Gateway)</text></g><!--entity browser--><g class="entity" data-entity="browser" data-source-line="17" data-uid="ent0002" id="entity_browser"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2617" x="627.84" y="60.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="69.2617" x="638.84" y="84.5117">&#171;browser&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.833" x="646.5544" y="101">Browser</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.8389" x="662.0514" y="117.4883">(UI)</text></g><!--entity router--><g class="entity" data-entity="router" data-source-line="18" data-uid="ent0003" id="entity_router"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="151.7285" x="597.61" y="222.4366"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="638.4743" y="245.9717">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.5928" x="609.6779" y="262.46">AWS Load Balancer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7285" x="607.61" y="278.9483">+ OpenShift Router</text></g><!--entity gateway--><g class="entity" data-entity="gateway" data-source-line="19" data-uid="ent0004" id="entity_gateway"><rect fill="#F1F1F1" height="118.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="244.7041" x="551.12" y="383.9066"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="638.4721" y="407.4417">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.7178" x="645.1132" y="423.93">Gateway</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8867" x="609.5287" y="440.4183">rhcl-workshop-gw</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.7041" x="561.12" y="456.9066">Listener: external-api.&lt;domain&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.6904" x="613.6268" y="473.3948">- TLS termination</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.8057" x="597.5692" y="489.8831">- Dedicated hostname</text></g><!--entity gw_auth--><g class="entity" data-entity="gw_auth" data-source-line="20" data-uid="ent0005" id="entity_gw_auth"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="200.4824" x="253.23" y="408.6366"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="54.6602" x="326.1411" y="432.1717">&#171;policy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.4824" x="263.23" y="448.66">AuthPolicy (Gateway-level)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.9336" x="291.0044" y="465.1483">- deny-by-default</text></g><!--entity httproute--><g class="entity" data-entity="httproute" data-source-line="21" data-uid="ent0006" id="entity_httproute"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="271.5967" x="537.67" y="594.8366"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="638.4683" y="618.3717">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.9082" x="636.0142" y="634.86">HTTPRoute</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.4346" x="597.2511" y="651.3483">external-proxy-public</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="251.5967" x="547.67" y="667.8366">- Paths: /nba, /epl, /laliga, /nfl, /nhl</text></g><!--entity route_auth--><g class="entity" data-entity="route_auth" data-source-line="22" data-uid="ent0007" id="entity_route_auth"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="182.9414" x="7" y="594.8366"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="54.6602" x="71.1406" y="618.3717">&#171;policy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.9414" x="17" y="634.86">AuthPolicy (Route-level)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.4297" x="22.7559" y="651.3483">- allow (public access)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.6738" x="29.1338" y="667.8366">- Overrides deny-all</text></g><!--entity backend--><g class="entity" data-entity="backend" data-source-line="23" data-uid="ent0008" id="entity_backend"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="128.1992" x="609.37" y="773.0866"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="71.8662" x="637.5365" y="796.6217">&#171;backend&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1992" x="619.37" y="813.11">Backend Service</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5771" x="633.681" y="829.5983">espn-proxy</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.6797" x="654.6298" y="846.0866">- Pod</text></g><!--entity espn_api--><g class="entity" data-entity="espn_api" data-source-line="24" data-uid="ent0009" id="entity_espn_api"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="159.5146" x="593.71" y="951.3466"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70.2871" x="638.3238" y="974.8817">&#171;external&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.9043" x="614.0152" y="991.37">External ESPN API</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.5146" x="603.71" y="1007.8583">(Third-party service)</text></g><g class="entity" data-entity="GMN17" data-source-line="36" data-uid="ent0018" id="entity_GMN17"><path d="M830.78,400.0966 L830.78,439.3666 L796.29,443.3666 L830.78,447.3666 L830.78,486.6493 A0,0 0 0 0 830.78,486.6493 L1064.1662,486.6493 A0,0 0 0 0 1064.1662,486.6493 L1064.1662,410.0966 L1054.1662,400.0966 L830.78,400.0966 A0,0 0 0 0 830.78,400.0966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1054.1662,400.0966 L1054.1662,410.0966 L1064.1662,410.0966 L1054.1662,400.0966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.582" x="873.6821" y="417.6649">Dedicated Hostname</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.0112" x="861.9675" y="432.9755">- external-api.&lt;domain&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.3862" x="836.78" y="448.286">- Separates external data sources</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.2295" x="890.4717" y="463.5966">from internal APIs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2642" x="846.841" y="478.9071">- Same Gateway policies apply</text></g><g class="entity" data-entity="GMN20" data-source-line="44" data-uid="ent0021" id="entity_GMN20"><path d="M224.74,602.1866 L224.74,633.8166 L190.34,637.8166 L224.74,641.8166 L224.74,673.4288 A0,0 0 0 0 224.74,673.4288 L502.198,673.4288 A0,0 0 0 0 502.198,673.4288 L502.198,612.1866 L492.198,602.1866 L224.74,602.1866 A0,0 0 0 0 224.74,602.1866" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M492.198,602.1866 L492.198,612.1866 L502.198,612.1866 L492.198,602.1866" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.3242" x="281.8069" y="619.7549">Policy Override Pattern</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.9585" x="234.9898" y="635.0655">&#9312;Gateway deny-all (default protection)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.7681" x="254.585" y="650.376">&#9313;Route allow (selective override)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.458" x="230.74" y="665.6866">&#9314;Result: Only /nba, /epl, etc. accessible</text></g><g class="entity" data-entity="GMN23" data-source-line="51" data-uid="ent0024" id="entity_GMN23"><path d="M772.81,772.7866 L772.81,812.0666 L738.04,816.0666 L772.81,820.0666 L772.81,859.3393 A0,0 0 0 0 772.81,859.3393 L1030.1396,859.3393 A0,0 0 0 0 1030.1396,859.3393 L1030.1396,782.7866 L1020.1396,772.7866 L772.81,772.7866 A0,0 0 0 0 772.81,772.7866" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1020.1396,772.7866 L1020.1396,782.7866 L1030.1396,782.7866 L1020.1396,772.7866" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.4087" x="830.2704" y="790.3549">ESPN Proxy Benefits</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.4067" x="780.7714" y="805.6655">- Single entry point for external data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.9141" x="779.5178" y="820.976">- Gateway policies (rate-limit, traffic)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.3296" x="778.81" y="836.2866">- Decouples external API from clients</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.8135" x="833.5681" y="851.5971">- Caching (optional)</text></g><!--link browser to router--><g class="link" data-entity-1="browser" data-entity-2="router" data-source-line="26" data-uid="lnk10" id="link_browser_router"><path d="M673.47,130.9166 C673.47,157.8266 673.47,189.1266 673.47,216.0166" fill="none" id="browser-to-router" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="673.47,222.0166,677.47,213.0166,673.47,217.0166,669.47,213.0166,673.47,222.0166" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.7388" x="674.47" y="174.0049">HTTPS Request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.0205" x="692.3291" y="189.3155">GET /nba</text></g><!--link router to gateway--><g class="link" data-entity-1="router" data-entity-2="gateway" data-source-line="27" data-uid="lnk11" id="link_router_gateway"><path d="M673.47,292.3866 C673.47,317.9866 673.47,347.6066 673.47,377.7166" fill="none" id="router-to-gateway" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="673.47,383.7166,677.47,374.7166,673.47,378.7166,669.47,374.7166,673.47,383.7166" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.6304" x="714.3428" y="335.4749">SNI routing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.376" x="674.47" y="350.7855">external-api.&lt;domain&gt;</text></g><!--link gateway to httproute--><g class="link" data-entity-1="gateway" data-entity-2="httproute" data-source-line="28" data-uid="lnk12" id="link_gateway_httproute"><path d="M673.47,503.1566 C673.47,532.6666 673.47,561.7466 673.47,588.5666" fill="none" id="gateway-to-httproute" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="673.47,594.5666,677.47,585.5666,673.47,589.5666,669.47,585.5666,673.47,594.5666" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.3965" x="682.5601" y="546.4049">Route match</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.5767" x="674.47" y="561.7155">/nba, /epl, etc.</text></g><!--link httproute to backend--><g class="link" data-entity-1="httproute" data-entity-2="backend" data-source-line="29" data-uid="lnk13" id="link_httproute_backend"><path d="M673.47,681.0266 C673.47,708.8366 673.47,739.0966 673.47,766.8866" fill="none" id="httproute-to-backend" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="673.47,772.8866,677.47,763.8866,673.47,767.8866,669.47,763.8866,673.47,772.8866" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.9717" x="726.2351" y="724.3549">Forward</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.502" x="674.47" y="739.6655">(allowed by route policy)</text></g><!--link backend to espn_api--><g class="link" data-entity-1="backend" data-entity-2="espn_api" data-source-line="30" data-uid="lnk14" id="link_backend_espn_api"><path d="M673.47,859.4566 C673.47,887.7466 673.47,918.4566 673.47,944.8766" fill="none" id="backend-to-espn_api" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="673.47,950.8766,677.47,941.8766,673.47,945.8766,669.47,941.8766,673.47,950.8766" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.8086" x="674.47" y="902.9149">Outbound HTTPS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.624" x="686.5623" y="918.2255">GET ESPN API</text></g><!--link gw_auth to gateway--><g class="link" data-entity-1="gw_auth" data-entity-2="gateway" data-source-line="32" data-uid="lnk15" id="link_gw_auth_gateway"><path d="M453.84,443.3666 C484.54,443.3666 512.66,443.3666 544.68,443.3666" fill="none" id="gw_auth-to-gateway" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="550.68,443.3666,541.68,439.3666,545.68,443.3666,541.68,447.3666,550.68,443.3666" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.8896" x="471.92" y="421.9349">applies to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.9565" x="472.3866" y="437.2455">(deny-all)</text></g><!--link route_auth to httproute--><g class="link" data-entity-1="route_auth" data-entity-2="httproute" data-source-line="33" data-uid="lnk16" id="link_route_auth_httproute"><path d="M181.11,594.3666 C220.49,576.0466 268.96,556.8666 314.97,547.6666 C409.21,528.8266 510.3697,560.4794 582.6697,591.9894" fill="none" id="route_auth-to-httproute" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="588.17,594.3866,581.5176,587.1239,583.5864,592.3889,578.3214,594.4577,588.17,594.3866" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.8896" x="333.5467" y="546.4049">applies to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.043" x="315.97" y="561.7155">(allow override)</text></g><!--SRC=[ZLN1Rjj64BtlLqnrajmmkHk60SbL7GE29PWAUX4GhCYHkF1gbjbTIX62VaJ_eEsdvKiwk-IQjAiKlGWIzMRcpPitmvzAt2b2U9hVhQUFzuiv55ew9uHxLbHBAmzGc4Dj2Cd3Dm4mayNptfg6oZkZZRsvsLfpScXlRs6XzfMVwGOlmVRIuqcU4-pU8j8bN6sqAW9ifUZvOZr-W5JsYUJv4Wo_UhGaDUEMLj8-aZAsH1i1CDCSmS-cblaF7_q-x9tLaOtsQyusrMfFXo13mHzeXV3AQuHvLmYcgmVELbJAO-4RYniQp_FL8woi-Ng6ev9mtsem4S8oX4bn-6ZMwiVeJm-J4KW7dQ8mq7OOCFqjXuMH9VUi9HKXz6TOraXvfNOUdap3X68Y6x_2GFnXdexDXcnLwEnaxBEhJ9tjJnjQAEUHq5v3aZ6JjNf_Kvg3L7IxeGpMYnpuhuCYwPMXyEWNB5N1IKkeZFCa3nXPTCL_H6FQ-6eLXmxZZbAcyOXw4dAMIETiUywwGRG9Jvyb1q5lbc6-Z-lrAcgmeHVoTHX1LZTRXeUiA-ahTmqVQ2lVmGUiDNzgoGCEFsaNVbAbOx7A-phg-7_unxe3zb9hSu9nMnXaKQ1pyO_b4QrL9RgsGSRr0_klvcQj-I57UrH5QD7LrBON-p9bww0EDjYMOPONoqP_ic_PVEjAsJ9Zr_ipk3PxwyPGuJDF7uOx9KGoQLQQ4sMtoMlNxG1oUC8l3Jg_eVlvEWez4XqaHIHVS4Z- -10JADeFfZQqt4WaU0hl1yC9el1maBweDZGSA_hY_KZqs1IT5EBONuqzILko1d5SRD_jkMq7sX5CHYB1K_YBA1o_RFms71w8ZRSD9s57GYItPZQSgzTzoxhMYatW3LTFJfXqIhq9UzNlgy3MPQQp58SBCWoBWM1sgQ2ukketz6EteLTN8hkyvFmynt05FTT922Ybb-1COzdAV3rtrXn0KNy1NGZZlEdMjH86ge7oMGGH0xkt7FkEcMQtJcb9mhg62ipr-nz_fiH9BXXtjm5Odd1w-HfD6