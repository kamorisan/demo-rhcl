<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="881px" preserveAspectRatio="none" style="width:1038px;height:881px;background:#FFFFFF;" version="1.1" viewBox="0 0 1038 881" width="1038px" zoomAndPan="magnify"><title>Policy Playground Architecture
(API Keys + Rate Limiting)</title><defs/><g><g class="title" data-source-line="14"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="221.8467" x="401.3099" y="23.5352">Policy Playground Architecture</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="188.9727" x="417.7469" y="40.0234">(API Keys + Rate Limiting)</text></g><!--entity browser--><g class="entity" data-entity="browser" data-source-line="16" data-uid="ent0002" id="entity_browser"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2617" x="590.61" y="60.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="69.2617" x="601.61" y="84.5117">&#171;browser&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.833" x="609.3244" y="101">Browser</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.8389" x="624.8214" y="117.4883">(UI)</text></g><!--entity router--><g class="entity" data-entity="router" data-source-line="17" data-uid="ent0003" id="entity_router"><rect fill="#F1F1F1" height="69.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="151.7285" x="560.38" y="237.4466"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="601.2443" y="260.9817">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.5928" x="572.4479" y="277.47">AWS Load Balancer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7285" x="570.38" y="293.9583">+ OpenShift Router</text></g><!--entity gateway--><g class="entity" data-entity="gateway" data-source-line="18" data-uid="ent0004" id="entity_gateway"><rect fill="#F1F1F1" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="273.1963" x="499.64" y="398.9066"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="601.2381" y="422.4417">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.7178" x="607.8793" y="438.93">Gateway</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8867" x="572.2948" y="455.4183">rhcl-workshop-gw</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.6904" x="576.3929" y="471.9066">- TLS termination</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="253.1963" x="509.64" y="488.3948">- Listener: rhcl-workshop.&lt;domain&gt;</text></g><!--entity gw_auth--><g class="entity" data-entity="gw_auth" data-source-line="19" data-uid="ent0005" id="entity_gw_auth"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="200.4824" x="7" y="407.1566"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="54.6602" x="79.9111" y="430.6917">&#171;policy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.4824" x="17" y="447.18">AuthPolicy (Gateway-level)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.9336" x="44.7744" y="463.6683">- deny-by-default</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.7393" x="35.3716" y="480.1566">- Zero-trust baseline</text></g><!--entity httproute--><g class="entity" data-entity="httproute" data-source-line="20" data-uid="ent0006" id="entity_httproute"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.3076" x="580.59" y="601.5966"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70" x="601.2438" y="625.1317">&#171;gateway&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.9082" x="598.7897" y="641.62">HTTPRoute</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9717" x="602.758" y="658.1083">demo-api</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.3076" x="590.59" y="674.5966">- Path: /hello</text></g><!--entity route_auth--><g class="entity" data-entity="route_auth" data-source-line="21" data-uid="ent0007" id="entity_route_auth"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="182.9414" x="46.77" y="601.5966"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="54.6602" x="110.9106" y="625.1317">&#171;policy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.9414" x="56.77" y="641.62">AuthPolicy (Route-level)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3027" x="72.0893" y="658.1083">- API key validation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.6465" x="65.4175" y="674.5966">- IAMALICE / IAMBOB</text></g><!--entity ratelimit--><g class="entity" data-entity="ratelimit" data-source-line="22" data-uid="ent0008" id="entity_ratelimit"><rect fill="#F1F1F1" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="174.1025" x="265.19" y="593.3566"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="54.6602" x="324.9112" y="616.8917">&#171;policy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.4023" x="301.0401" y="633.38">RateLimitPolicy</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.1025" x="275.19" y="649.8683">- Identity-based limits</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.9189" x="291.2818" y="666.3566">- Alice: 5 req/10s</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.6592" x="294.9117" y="682.8448">- Bob: 2 req/10s</text></g><!--entity backend--><g class="entity" data-entity="backend" data-source-line="23" data-uid="ent0009" id="entity_backend"><rect fill="#F1F1F1" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="128.1992" x="572.14" y="788.0966"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="71.8662" x="600.3065" y="811.6317">&#171;backend&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.1992" x="582.14" y="828.12">Backend Service</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9717" x="602.7538" y="844.6083">demo-api</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.6797" x="617.3998" y="861.0966">- Pod</text></g><g class="entity" data-entity="GMN17" data-source-line="35" data-uid="ent0018" id="entity_GMN17"><path d="M242.26,399.1966 L242.26,446.1366 L207.66,450.1366 L242.26,454.1366 L242.26,501.0598 A0,0 0 0 0 242.26,501.0598 L464.2141,501.0598 A0,0 0 0 0 464.2141,501.0598 L464.2141,409.1966 L454.2141,399.1966 L242.26,399.1966 A0,0 0 0 0 242.26,399.1966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M454.2141,399.1966 L454.2141,409.1966 L464.2141,409.1966 L454.2141,399.1966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="159.6689" x="268.9026" y="416.7649">Policy Evaluation Order:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.9541" x="248.26" y="432.0755">&#9312;Gateway AuthPolicy (deny-all)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.8105" x="259.8318" y="447.386">&#9313;Route AuthPolicy (API key)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.168" x="250.6531" y="462.6966">&#9314;RateLimitPolicy (token count)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.4116" x="281.5312" y="478.0071">&#9315;All pass &#8594; Forward</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.2603" x="264.1069" y="493.3177">&#9316;Any fail &#8594; 401/403/429</text></g><g class="entity" data-entity="GMN20" data-source-line="44" data-uid="ent0021" id="entity_GMN20"><path d="M735.01,787.7966 L735.01,827.0666 L700.4,831.0666 L735.01,835.0666 L735.01,874.3493 A0,0 0 0 0 735.01,874.3493 L1031.4665,874.3493 A0,0 0 0 0 1031.4665,874.3493 L1031.4665,797.7966 L1021.4665,787.7966 L735.01,787.7966 A0,0 0 0 0 735.01,787.7966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1021.4665,787.7966 L1021.4665,797.7966 L1031.4665,797.7966 L1021.4665,787.7966" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.001" x="822.2378" y="805.3649">Response Codes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.917" x="754.2798" y="820.6755">&#8226; 200 = Success (valid key, under limit)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.4565" x="741.01" y="835.986">&#8226; 401 = Unauthorized (missing/invalid key)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0889" x="761.6938" y="851.2966">&#8226; 403 = Forbidden (denied by policy)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.9048" x="755.2859" y="866.6071">&#8226; 429 = Too Many Requests (rate limit)</text></g><!--link browser to router--><g class="link" data-entity-1="browser" data-entity-2="router" data-source-line="25" data-uid="lnk10" id="link_browser_router"><path d="M636.24,130.7666 C636.24,161.5066 636.24,200.4966 636.24,231.2166" fill="none" id="browser-to-router" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="636.24,237.2166,640.24,228.2166,636.24,232.2166,632.24,228.2166,636.24,237.2166" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.7388" x="643.4924" y="174.0149">HTTPS Request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.4028" x="657.6604" y="189.3255">GET /hello</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.2437" x="637.24" y="204.636">APIKEY IAMALICE</text></g><!--link router to gateway--><g class="link" data-entity-1="router" data-entity-2="gateway" data-source-line="26" data-uid="lnk11" id="link_router_gateway"><path d="M636.24,307.1066 C636.24,333.0666 636.24,363.2866 636.24,392.6566" fill="none" id="router-to-gateway" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="636.24,398.6566,640.24,389.6566,636.24,393.6566,632.24,389.6566,636.24,398.6566" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.6304" x="637.24" y="357.9749">SNI routing</text></g><!--link gateway to httproute--><g class="link" data-entity-1="gateway" data-entity-2="httproute" data-source-line="27" data-uid="lnk12" id="link_gateway_httproute"><path d="M636.24,501.6966 C636.24,532.6566 636.24,565.8166 636.24,595.1566" fill="none" id="gateway-to-httproute" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="636.24,601.1566,640.24,592.1566,636.24,596.1566,632.24,592.1566,636.24,601.1566" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.3965" x="637.24" y="552.4249">Route match</text></g><!--link httproute to backend--><g class="link" data-entity-1="httproute" data-entity-2="backend" data-source-line="28" data-uid="lnk13" id="link_httproute_backend"><path d="M636.24,687.8966 C636.24,717.7966 636.24,751.6966 636.24,781.6166" fill="none" id="httproute-to-backend" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="636.24,787.6166,640.24,778.6166,636.24,782.6166,632.24,778.6166,636.24,787.6166" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.9717" x="672.0601" y="739.3649">Forward</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6118" x="637.24" y="754.6755">(if all policies pass)</text></g><!--link gw_auth to gateway--><g class="link" data-entity-1="gw_auth" data-entity-2="gateway" data-source-line="30" data-uid="lnk14" id="link_gw_auth_gateway"><path d="M182.33,406.8566 C222.56,386.1466 273.8,363.6266 322.74,353.1166 C401.01,336.3066 482.4262,364.4878 544.8062,395.7578" fill="none" id="gw_auth-to-gateway" style="stroke:#000000;stroke-width:1;