---
- name: Setup OpenShift GitOps Operator
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Detect if GitOps Operator Subscription exists
      ansible.builtin.command: oc get subscription openshift-gitops-operator -n openshift-operators
      register: gitops_subscription
      changed_when: false
      failed_when: false

    - name: Detect if GitOps CSV exists
      ansible.builtin.shell: oc get csv -n openshift-operators | grep -q gitops
      register: gitops_csv
      changed_when: false
      failed_when: false

    - name: Set gitops_installed fact
      ansible.builtin.set_fact:
        gitops_installed: "{{ (gitops_subscription.rc == 0) and (gitops_csv.rc == 0) }}"

    - name: Install OpenShift GitOps operator (if missing)
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<'YAML' | oc apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: openshift-gitops
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: openshift-gitops-operator
          namespace: openshift-operators
        spec:
          channel: latest
          installPlanApproval: Automatic
          name: openshift-gitops-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        YAML
      args:
        executable: /bin/bash
      register: gitops_install
      changed_when: "'configured' in (gitops_install.stdout | lower) or 'created' in (gitops_install.stdout | lower)"
      when: not gitops_installed

    - name: Wait for openshift-gitops namespace to exist
      ansible.builtin.command: oc get namespace openshift-gitops
      register: wait_gitops_ns
      changed_when: false
      retries: 60
      delay: 10
      until: wait_gitops_ns.rc == 0

    - name: Wait for OpenShift GitOps server deployment to be created
      ansible.builtin.command: oc -n openshift-gitops get deployment openshift-gitops-server
      register: wait_gitops_deploy
      changed_when: false
      retries: 60
      delay: 10
      until: wait_gitops_deploy.rc == 0

    - name: Wait for OpenShift GitOps server rollout
      ansible.builtin.command: oc -n openshift-gitops rollout status deployment/openshift-gitops-server --timeout=10m
      register: gitops_rollout
      changed_when: false

    - name: Grant ArgoCD permissions for monitoring namespace
      ansible.builtin.command: oc adm policy add-role-to-user admin system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller -n monitoring
      register: monitoring_rbac
      changed_when: "'added' in (monitoring_rbac.stdout | lower)"
      failed_when: false

    - name: Grant ArgoCD permissions for kuadrant-system namespace
      ansible.builtin.command: oc adm policy add-role-to-user edit system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller -n kuadrant-system
      register: kuadrant_rbac
      changed_when: "'added' in (kuadrant_rbac.stdout | lower)"
      failed_when: false

    - name: Verify ArgoCD permissions
      ansible.builtin.shell: |
        echo "Checking ArgoCD permissions:"
        echo -n "  monitoring namespace: "
        oc auth can-i create deployment -n monitoring --as=system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller
        echo -n "  kuadrant-system namespace: "
        oc auth can-i create servicemonitor -n kuadrant-system --as=system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller
      register: rbac_check
      changed_when: false

    - name: Print GitOps installation status
      ansible.builtin.debug:
        msg:
          - "OpenShift GitOps operator installed successfully"
          - "Namespace: openshift-gitops"
          - "RBAC permissions granted for monitoring and kuadrant-system namespaces"
          - "Ready to deploy ArgoCD Applications"
