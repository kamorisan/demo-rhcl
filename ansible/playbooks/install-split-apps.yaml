---
- name: Install RHCL split applications (app-1, app-2, app-3)
  hosts: localhost
  gather_facts: no
  vars:
    apps_cluster_domain: "apps.cluster-{{ cluster_id }}.{{ cluster_id }}.{{ external_base_domain }}"
    git_branch: "feature/stable-apps1-5-espn-working"  # Default branch, override with -e git_branch=your-branch

  tasks:
    - name: Validate required parameters
      ansible.builtin.fail:
        msg: "Missing required parameter: {{ item }}"
      when: vars[item] is not defined or vars[item] | trim == ''
      loop:
        - env_name
        - cluster_id
        - external_base_domain
      loop_control:
        label: "{{ item }}"

    - name: Detect Route53 Hosted Zone ID for external_base_domain
      ansible.builtin.shell: |
        set -euo pipefail
        aws route53 list-hosted-zones --query "HostedZones[?Name=='{{ external_base_domain }}.'].Id" --output text | sed 's|/hostedzone/||'
      register: detected_hosted_zone_id
      changed_when: false
      when: (aws_access_key_id | default('') | trim != '') and (aws_secret_access_key | default('') | trim != '')

    - name: Set route53_hosted_zone_id
      ansible.builtin.set_fact:
        route53_hosted_zone_id: "{{ detected_hosted_zone_id.stdout | default('') | trim }}"
      when: detected_hosted_zone_id is defined

    - name: Create AWS credentials Secret for cert-manager (if AWS credentials provided)
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n cert-manager apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: cert-manager-aws-creds
          namespace: cert-manager
        type: Opaque
        stringData:
          aws_access_key_id: "{{ aws_access_key_id }}"
          aws_secret_access_key: "{{ aws_secret_access_key }}"
        EOF
      args:
        executable: /bin/bash
      when: (aws_access_key_id | default('') | trim != '') and (aws_secret_access_key | default('') | trim != '')
      register: aws_secret
      changed_when: "'configured' in (aws_secret.stdout | lower) or 'created' in (aws_secret.stdout | lower)"

    - name: Create AWS credentials Secret for DNSPolicy in openshift-ingress (if AWS credentials provided)
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n openshift-ingress apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: aws-credentials
          namespace: openshift-ingress
        type: kuadrant.io/aws
        stringData:
          AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
          AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
          AWS_REGION: "{{ aws_region | default('us-east-2') }}"
        EOF
      args:
        executable: /bin/bash
      when: (aws_access_key_id | default('') | trim != '') and (aws_secret_access_key | default('') | trim != '')
      register: aws_dnspolicy_secret
      changed_when: "'configured' in (aws_dnspolicy_secret.stdout | lower) or 'created' in (aws_dnspolicy_secret.stdout | lower)"

    - name: Apply Application 2-2 (Kuadrant Observability)
      ansible.builtin.shell: |
        set -euo pipefail
        oc apply -f - <<'EOF'
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-2-2-kuadrant-observability
          namespace: openshift-gitops
          annotations:
            argocd.argoproj.io/sync-wave: "2"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: https://github.com/Kuadrant/kuadrant-operator
            targetRevision: v1.3.0
            path: config/install/configure/observability
          destination:
            server: https://kubernetes.default.svc
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app2_2_result
      changed_when: "'configured' in (app2_2_result.stdout | lower) or 'created' in (app2_2_result.stdout | lower)"

    - name: Wait for Application 2-2 to be Synced
      ansible.builtin.command: oc get application rhcl-app-2-2-kuadrant-observability -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app2_2_sync
      until: app2_2_sync.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 1 (operators) - no patches needed
      ansible.builtin.shell: |
        set -euo pipefail
        oc apply -f - <<'EOF'
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-1-operators
          namespace: openshift-gitops
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "1"
        spec:
          project: default
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-1-operators
          destination:
            server: https://kubernetes.default.svc
            namespace: kuadrant-system
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app1_result
      changed_when: "'configured' in (app1_result.stdout | lower) or 'created' in (app1_result.stdout | lower)"

    - name: Wait for Application 1 to be Synced
      ansible.builtin.command: oc get application rhcl-app-1-operators -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app1_sync
      until: app1_sync.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 2 (platform-crs) with ClusterIssuer patch
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<'EOF' | oc apply -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-2-platform-crs
          namespace: openshift-gitops
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "2"
        spec:
          project: default
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-2-platform-crs
            # No kustomize patches needed - cert-manager auto-detects hostedZoneID
          destination:
            server: https://kubernetes.default.svc
            namespace: demo
          syncPolicy:
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app2_result
      changed_when: "'configured' in (app2_result.stdout | lower) or 'created' in (app2_result.stdout | lower)"

    - name: Manually sync Application 2
      ansible.builtin.command: oc patch application rhcl-app-2-platform-crs -n openshift-gitops --type merge -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{}}}'
      register: app2_sync
      changed_when: true

    - name: Wait for Application 2 to be Synced
      ansible.builtin.command: oc get application rhcl-app-2-platform-crs -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app2_sync_status
      until: app2_sync_status.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 3 (gateways) with hostname patches
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<'EOF' | oc apply -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-3-gateways
          namespace: openshift-gitops
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "3"
        spec:
          project: default
          ignoreDifferences:
          - group: gateway.networking.k8s.io
            kind: Gateway
            jqPathExpressions:
            - .status
          - group: kuadrant.io
            kind: DNSPolicy
            jqPathExpressions:
            - .status
          - group: kuadrant.io
            kind: TLSPolicy
            jqPathExpressions:
            - .status
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-3-gateways
            kustomize:
              patches:
                # Gateway rhcl-workshop-gw patches
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: Gateway
                    name: rhcl-workshop-gw
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/listeners/1/hostname
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/listeners/2/hostname
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/listeners/3/hostname
                      value: grafana-rhcl-workshop.{{ external_base_domain }}

                # Gateway rhcl-external-gw patches
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: Gateway
                    name: rhcl-external-gw
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/listeners/1/hostname
                      value: external-api.{{ external_base_domain }}

                # Gateway rhcl-ai-gw patches
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: Gateway
                    name: rhcl-ai-gw
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/listeners/0/hostname
                      value: ai.{{ external_base_domain }}
                    - op: replace
                      path: /spec/listeners/1/hostname
                      value: ai.{{ external_base_domain }}

                # Gateway rhcl-mcp-gw patches
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: Gateway
                    name: rhcl-mcp-gw
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/listeners/0/hostname
                      value: mcp.{{ external_base_domain }}
                    - op: replace
                      path: /spec/listeners/1/hostname
                      value: mcp.{{ external_base_domain }}

                # Route patches
                - target:
                    group: route.openshift.io
                    version: v1
                    kind: Route
                    name: rhcl-workshop-gw
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/host
                      value: rhcl-workshop.{{ external_base_domain }}

                - target:
                    group: route.openshift.io
                    version: v1
                    kind: Route
                    name: rhcl-workshop-gw-oidc
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/host
                      value: oidc-rhcl-workshop.{{ external_base_domain }}

                - target:
                    group: route.openshift.io
                    version: v1
                    kind: Route
                    name: rhcl-workshop-gw-grafana
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/host
                      value: grafana-rhcl-workshop.{{ external_base_domain }}
          destination:
            server: https://kubernetes.default.svc
            namespace: openshift-ingress
          syncPolicy:
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app3_result
      changed_when: "'configured' in (app3_result.stdout | lower) or 'created' in (app3_result.stdout | lower)"

    - name: Manually sync Application 3
      ansible.builtin.command: oc patch application rhcl-app-3-gateways -n openshift-gitops --type merge -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{}}}'
      register: app3_sync
      changed_when: true

    - name: Wait for Application 3 to be Synced
      ansible.builtin.command: oc get application rhcl-app-3-gateways -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app3_sync_status
      until: app3_sync_status.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 4 (demo-apps)
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<'EOF' | oc apply -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-4-demo-apps
          namespace: openshift-gitops
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "4"
        spec:
          project: default
          ignoreDifferences:
          - group: apps
            kind: Deployment
            name: rhcl-ai-bot
            namespace: rhcl-ai-bot
            jqPathExpressions:
            - .spec.template.spec.containers[].image
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-4-demo-apps
            kustomize:
              patches:
                # AI Bot Deployment environment variables
                - target:
                    group: apps
                    version: v1
                    kind: Deployment
                    name: rhcl-ai-bot
                    namespace: rhcl-ai-bot
                  patch: |-
                    - op: replace
                      path: /spec/template/spec/containers/0/env/8/value
                      value: http://external-api.{{ external_base_domain }}
                    - op: replace
                      path: /spec/template/spec/containers/0/env/9/value
                      value: http://mcp.{{ external_base_domain }}
          destination:
            server: https://kubernetes.default.svc
            namespace: demo
          syncPolicy:
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app4_result
      changed_when: "'configured' in (app4_result.stdout | lower) or 'created' in (app4_result.stdout | lower)"

    - name: Manually sync Application 4
      ansible.builtin.command: oc patch application rhcl-app-4-demo-apps -n openshift-gitops --type merge -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{}}}'
      register: app4_sync
      changed_when: true

    - name: Wait for Application 4 to be Synced
      ansible.builtin.command: oc get application rhcl-app-4-demo-apps -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app4_sync_status
      until: app4_sync_status.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Create OpenAI API key Secret for rhcl-ai-bot (if provided)
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n rhcl-ai-bot apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: rhcl-ai-bot-llm
          namespace: rhcl-ai-bot
        type: Opaque
        stringData:
          apiKey: "{{ openai_api_key }}"
        EOF
      args:
        executable: /bin/bash
      when: (openai_api_key | default('') | trim != '')
      register: openai_secret
      changed_when: "'configured' in (openai_secret.stdout | lower) or 'created' in (openai_secret.stdout | lower)"

    - name: Apply Application 6-1 (Core Observability - Grafana)
      ansible.builtin.shell: |
        set -euo pipefail
        oc apply -f - <<'EOF'
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-6-1-core-observability
          namespace: openshift-gitops
          annotations:
            argocd.argoproj.io/sync-wave: "6"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-6-1-core-observability
          destination:
            server: https://kubernetes.default.svc
            namespace: monitoring
          syncPolicy:
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
          ignoreDifferences:
            - group: grafana.integreatly.org
              kind: Grafana
              jqPathExpressions:
                - .status
            - group: grafana.integreatly.org
              kind: GrafanaDatasource
              jqPathExpressions:
                - .status
            - group: grafana.integreatly.org
              kind: GrafanaDashboard
              jqPathExpressions:
                - .status
        EOF
      args:
        executable: /bin/bash
      register: app6_1_result
      changed_when: "'configured' in (app6_1_result.stdout | lower) or 'created' in (app6_1_result.stdout | lower)"

    - name: Manually sync Application 6-1
      ansible.builtin.command: oc patch application rhcl-app-6-1-core-observability -n openshift-gitops --type merge -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{}}}'
      register: app6_1_sync_trigger
      changed_when: true

    - name: Wait for Application 6-1 to be Synced
      ansible.builtin.command: oc get application rhcl-app-6-1-core-observability -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app6_1_sync
      until: app6_1_sync.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 6-3 (Kuadrant Dashboards)
      ansible.builtin.shell: |
        set -euo pipefail
        oc apply -f - <<'EOF'
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-6-3-kuadrant-dashboards
          namespace: openshift-gitops
          annotations:
            argocd.argoproj.io/sync-wave: "6"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: https://github.com/Kuadrant/kuadrant-operator
            targetRevision: v1.3.0
            path: examples/dashboards
          destination:
            server: https://kubernetes.default.svc
            namespace: monitoring
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app6_3_result
      changed_when: "'configured' in (app6_3_result.stdout | lower) or 'created' in (app6_3_result.stdout | lower)"

    - name: Wait for Application 6-3 to be Synced
      ansible.builtin.command: oc get application rhcl-app-6-3-kuadrant-dashboards -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app6_3_sync
      until: app6_3_sync.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Apply Application 5 (routes-policies) - Phase 1
      ansible.builtin.shell: |
        set -euo pipefail
        cat <<'EOF' | oc apply -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: rhcl-app-5-routes-policies
          namespace: openshift-gitops
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "5"
        spec:
          project: default
          source:
            repoURL: https://github.com/kamorisan/demo-rhcl.git
            targetRevision: {{ git_branch }}
            path: gitops/apps/rhcl-demo-split/app-5-routes-policies
            kustomize:
              patches:
                # httproute-ui: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: rhcl-ui
                    namespace: demo
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-oidc-portal: hostname and gateway (multiple parentRefs)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: oidc-portal
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-api: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: demo-api
                    namespace: demo
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-grafana: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: grafana-rhcl-workshop
                    namespace: monitoring
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: grafana-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-secure-demo: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: secure-demo
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-oidc-portal: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: oidc-portal
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-keycloak: hostnames and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: keycloak
                    namespace: rhcl-keycloak
                  patch: |-
                    - op: replace
                      path: /spec/hostnames
                      value:
                        - rhcl-workshop.{{ external_base_domain }}
                        - oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-oidc-portal-callback: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: oidc-portal-callback
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-oidc-portal-whoami: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: oidc-portal-whoami
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: oidc-rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-ai-bot-main: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: ai-bot-main
                    namespace: rhcl-ai-bot
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-ai-bot-ai: hostname and gateway (uses external_base_domain)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: ai-bot-ai
                    namespace: rhcl-ai-bot
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: ai.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-ai-gw

                # httproute-mcp-gateway: hostname and gateway (MCP system)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: rhcl-mcp-gateway
                    namespace: mcp-system
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: mcp.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-mcp-gw

                # mcp-gateway-extension: publicHost
                - target:
                    group: mcp.kuadrant.io
                    version: v1alpha1
                    kind: MCPGatewayExtension
                    name: rhcl-mcp
                    namespace: mcp-system
                  patch: |-
                    - op: replace
                      path: /spec/publicHost
                      value: mcp.{{ external_base_domain }}

                # httproute-ai-bot-mcp-server: hostname for MCP Server Registration
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: ai-bot-mcp-server
                    namespace: rhcl-ai-bot
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: mcp.{{ external_base_domain }}

                # Phase 4: External Proxy
                # httproute-external-proxy: gateway only (no hostname)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: external-proxy
                    namespace: demo
                  patch: |-
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-external-proxy-public: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: external-proxy-public
                    namespace: demo
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: external-api.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-external-gw
                    - op: replace
                      path: /spec/parentRefs/1/name
                      value: rhcl-external-gw

                # Phase 5: A/B Canary and JWT Demo
                # httproute-ab-demo: hostname and gateway (ab-canary-external.yaml)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: ab-demo
                    namespace: demo-ab
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # httproute-jwt-demo: hostname and gateway
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: jwt-demo
                    namespace: demo-jwt
                  patch: |-
                    - op: replace
                      path: /spec/hostnames/0
                      value: rhcl-workshop.{{ external_base_domain }}
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # Phase 6: HTTP-to-HTTPS redirect
                # httproute-http-to-https: gateway only (no hostname)
                - target:
                    group: gateway.networking.k8s.io
                    version: v1
                    kind: HTTPRoute
                    name: http-to-https
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/parentRefs/0/name
                      value: rhcl-workshop-gw

                # gateway-authpolicy: replace gateway name
                - target:
                    group: kuadrant.io
                    version: v1
                    kind: AuthPolicy
                    name: rhcl-gw-auth
                    namespace: openshift-ingress
                  patch: |-
                    - op: replace
                      path: /spec/targetRef/name
                      value: rhcl-workshop-gw

                # secure-demo OIDCPolicy: replace URLs
                - target:
                    group: extensions.kuadrant.io
                    version: v1alpha1
                    kind: OIDCPolicy
                    name: secure-demo-oidc
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/provider/issuerURL
                      value: https://oidc-rhcl-workshop.{{ external_base_domain }}/auth/realms/rhcl
                    - op: replace
                      path: /spec/provider/authorizationEndpoint
                      value: https://oidc-rhcl-workshop.{{ external_base_domain }}/auth/realms/rhcl/protocol/openid-connect/auth
                    - op: replace
                      path: /spec/provider/tokenEndpoint
                      value: https://oidc-rhcl-workshop.{{ external_base_domain }}/auth/realms/rhcl/protocol/openid-connect/token
                    - op: replace
                      path: /spec/provider/redirectURI
                      value: https://oidc-rhcl-workshop.{{ external_base_domain }}/auth/callback

                # jwt-demo-jwt AuthPolicy: replace issuerUrl
                - target:
                    group: kuadrant.io
                    version: v1
                    kind: AuthPolicy
                    name: jwt-demo-jwt
                    namespace: demo-jwt
                  patch: |-
                    - op: replace
                      path: /spec/defaults/rules/authentication/jwt/jwt/issuerUrl
                      value: https://rhcl-workshop.{{ external_base_domain }}/auth/realms/rhcl

                # secure-demo-jwt AuthPolicy: replace issuerUrl
                - target:
                    group: kuadrant.io
                    version: v1
                    kind: AuthPolicy
                    name: secure-demo-jwt
                    namespace: rhcl-oidc-portal
                  patch: |-
                    - op: replace
                      path: /spec/defaults/rules/authentication/jwt/jwt/issuerUrl
                      value: https://rhcl-workshop.{{ external_base_domain }}/auth/realms/rhcl
          destination:
            server: https://kubernetes.default.svc
            namespace: demo
          syncPolicy:
            syncOptions:
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
        EOF
      args:
        executable: /bin/bash
      register: app5_result
      changed_when: "'configured' in (app5_result.stdout | lower) or 'created' in (app5_result.stdout | lower)"

    - name: Manually sync Application 5
      ansible.builtin.command: oc patch application rhcl-app-5-routes-policies -n openshift-gitops --type merge -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{}}}'
      register: app5_sync
      changed_when: true

    - name: Wait for Application 5 to be Synced
      ansible.builtin.command: oc get application rhcl-app-5-routes-policies -n openshift-gitops -o jsonpath='{.status.sync.status}'
      register: app5_sync_status
      until: app5_sync_status.stdout == "Synced"
      retries: 60
      delay: 10
      changed_when: false

    - name: Print application URLs
      ansible.builtin.debug:
        msg:
          - "Environment: {{ env_name }}"
          - "Cluster ID: {{ cluster_id }}"
          - "External Base Domain: {{ external_base_domain }}"
          - ""
          - "Application 1 (operators): deployed"
          - "Application 2 (platform-crs): deployed"
          - "Application 3 (gateways): deployed"
          - "Application 4 (demo-apps): deployed"
          - "Application 5 (routes-policies): deployed - All 28 resources"
          - ""
          - "Workshop URL: https://rhcl-workshop.{{ external_base_domain }}/"
          - "OIDC URL: https://oidc-rhcl-workshop.{{ external_base_domain }}/"
          - "External API: https://external-api.{{ external_base_domain }}/"
          - "AI Bot: https://ai.{{ external_base_domain }}/"
          - "MCP: https://mcp.{{ external_base_domain }}/"
          - ""
          - "OpenAI API Key: {{ 'configured' if (openai_api_key | default('') | trim != '') else 'NOT configured (AI features disabled)' }}"
          - "AWS Credentials: {{ 'configured' if (aws_access_key_id | default('') | trim != '') else 'NOT configured (DNS/TLS disabled)' }}"
